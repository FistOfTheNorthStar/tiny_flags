[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny_flags"
version = "2.0.0"
authors = [
  { name="Kaarle Kulvik", email="k.kulvik@gmail.com" },
]
description = "Map options/flags to methods using 32 or 64bit integers for optimized state management."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/FistOfTheNorthStar/tiny_flags"
Issues = "https://github.com/FistOfTheNorthStar/tiny_flags/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "mypy>=1.20.2",
    "ruff>=0.15.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
